<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Tuyển Dụng HR Freelance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800">
    <!-- Header Banner -->
    <header class="bg-indigo-700 text-white py-10 px-6 shadow-md">
        <div class="max-w-6xl mx-auto text-center">
            <h1 class="text-3xl md:text-5xl font-bold mb-3">Cổng Tuyển Dụng HR Freelance</h1>
            <p class="text-indigo-200 text-base md:text-lg max-w-2xl mx-auto">Danh sách cơ hội việc làm cập nhật mới nhất. Tìm kiếm vị trí phù hợp và ứng tuyển ngay!</p>
        </div>
    </header>

    <!-- Search & Filters -->
    <main class="max-w-6xl mx-auto px-6 -mt-6">
        <div class="bg-white rounded-xl shadow-lg p-4 md:p-6 mb-8 border border-slate-100">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Tìm kiếm</label>
                    <div class="relative">
                        <i class="fa-solid fa-search absolute left-3 top-3
